<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nártiva Administração</title>
<meta name="robots" content="noindex" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
/* ==========================================================================
   NÁRTIVA — design tokens
   Paleta sóbria: branco/tinta, um único acento azul-tinta, dourado apagado
   só para as estrelas de avaliação. Sem bege, sem verde, sem pastel.
   ========================================================================== */

:root {
  --bg: #ffffff;
  --surface: #f6f6f4;
  --surface-2: #efefec;
  --ink: #15161a;
  --ink-soft: #5a5c63;
  --ink-faint: #9a9ba1;
  --line: #e4e4e0;
  --accent: #1f2c4d;
  --accent-soft: #4a5a86;
  --star: #b6923f;
  --radius: 3px;
  --serif: "Fraunces", "Iowan Old Style", "Georgia", serif;
  --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --ease: cubic-bezier(0.65, 0, 0.35, 1);
  --dur: 480ms;
}

[data-theme="dark"] {
  --bg: #0d0d10;
  --surface: #17171b;
  --surface-2: #1f2024;
  --ink: #ececec;
  --ink-soft: #a3a4ab;
  --ink-faint: #6c6d74;
  --line: #2a2b30;
  --accent: #8fa1d6;
  --accent-soft: #6b7bab;
  --star: #d0af5e;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
  transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
}

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

a { color: inherit; text-decoration: none; }
img { display: block; max-width: 100%; }

::selection { background: var(--accent); color: var(--bg); }

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}

/* ---------- layout shell ---------- */

.wrap {
  max-width: 1160px;
  margin: 0 auto;
  padding: 0 32px;
}

/* ---------- header ---------- */

.site-header {
  position: sticky;
  top: 0;
  z-index: 40;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
  transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease);
}

.site-header .wrap {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 76px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: var(--serif);
  font-weight: 600;
  font-size: 20px;
  letter-spacing: 0.02em;
}

.brand svg { width: 26px; height: 26px; color: var(--accent); }
.brand small {
  display: block;
  font-family: var(--sans);
  font-weight: 500;
  font-size: 9.5px;
  letter-spacing: 0.22em;
  color: var(--ink-faint);
  margin-top: 2px;
}

nav.main-nav {
  display: flex;
  align-items: center;
  gap: 36px;
}

nav.main-nav a {
  font-size: 14.5px;
  color: var(--ink-soft);
  position: relative;
  padding: 4px 0;
  transition: color 200ms var(--ease);
}
nav.main-nav a::after {
  content: "";
  position: absolute;
  left: 0; right: 0; bottom: -2px;
  height: 1px;
  background: var(--accent);
  transform: scaleX(0);
  transform-origin: right;
  transition: transform 260ms var(--ease);
}
nav.main-nav a:hover { color: var(--ink); }
nav.main-nav a:hover::after { transform: scaleX(1); transform-origin: left; }

.header-actions { display: flex; align-items: center; gap: 18px; }

/* ---------- theme toggle (sol/lua) ---------- */

.theme-toggle {
  width: 40px; height: 40px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--surface);
  position: relative;
  cursor: pointer;
  transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease), transform 200ms var(--ease);
}
.theme-toggle:hover { transform: rotate(-8deg); }
.theme-toggle svg {
  position: absolute;
  inset: 0;
  margin: auto;
  width: 19px; height: 19px;
  color: var(--ink);
  transition: opacity var(--dur) var(--ease), transform var(--dur) var(--ease);
}

.icon-moon { opacity: 1; transform: scale(1) rotate(0deg); }
.icon-sun { opacity: 0; transform: scale(0.4) rotate(-90deg); }
[data-theme="dark"] .icon-moon { opacity: 0; transform: scale(0.4) rotate(90deg); }
[data-theme="dark"] .icon-sun { opacity: 1; transform: scale(1) rotate(0deg); }

/* ---------- hero ---------- */

.hero {
  padding: 88px 0 56px;
  border-bottom: 1px solid var(--line);
}
.hero .eyebrow {
  font-size: 12px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ink-faint);
  margin: 0 0 18px;
}
.hero h1 {
  font-family: var(--serif);
  font-weight: 500;
  font-size: clamp(34px, 5vw, 54px);
  line-height: 1.12;
  letter-spacing: -0.01em;
  margin: 0 0 20px;
  max-width: 15ch;
}
.hero h1 em { font-style: italic; color: var(--accent-soft); }
.hero p {
  font-size: 16px;
  color: var(--ink-soft);
  max-width: 46ch;
  line-height: 1.6;
  margin: 0;
}

/* ---------- section headings ---------- */

.section { padding: 72px 0; border-bottom: 1px solid var(--line); }
.section-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 40px;
  gap: 20px;
}
.section-head h2 {
  font-family: var(--serif);
  font-weight: 500;
  font-size: 28px;
  margin: 0;
}
.section-head .count {
  font-size: 13px;
  color: var(--ink-faint);
  font-variant-numeric: tabular-nums;
}

/* ---------- book grid / dog-ear cards ---------- */

.book-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 40px 28px;
}

.book-card { cursor: pointer; }

.book-cover {
  position: relative;
  aspect-ratio: 2 / 3;
  background: var(--surface-2);
  border: 1px solid var(--line);
  overflow: hidden;
  border-radius: var(--radius);
  transition: box-shadow 260ms var(--ease), transform 260ms var(--ease);
}
.book-cover img { width: 100%; height: 100%; object-fit: cover; }

.book-cover::after {
  /* dobra da página — assinatura visual do site */
  content: "";
  position: absolute;
  top: 0; right: 0;
  width: 26px; height: 26px;
  background: linear-gradient(135deg, transparent 50%, var(--bg) 50.5%);
  box-shadow: -3px 3px 6px rgba(0,0,0,0.12);
  transform: translate(26px, -26px);
  transition: transform 320ms var(--ease);
}
.book-card:hover .book-cover::after { transform: translate(0, 0); }
.book-card:hover .book-cover {
  transform: translateY(-4px);
  box-shadow: 0 16px 28px -18px rgba(0,0,0,0.35);
}

.book-meta { padding-top: 14px; }
.book-title {
  font-family: var(--serif);
  font-size: 16.5px;
  font-weight: 600;
  margin: 0 0 4px;
  line-height: 1.3;
}
.book-author {
  font-size: 13px;
  color: var(--ink-soft);
  margin: 0 0 8px;
}
.book-rating {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12.5px;
  color: var(--ink-faint);
  font-variant-numeric: tabular-nums;
}
.book-rating svg { width: 13px; height: 13px; color: var(--star); }

.empty-state {
  padding: 48px 0;
  color: var(--ink-faint);
  font-size: 14px;
  border: 1px dashed var(--line);
  border-radius: var(--radius);
  text-align: center;
}

/* ---------- lendo agora (fim do scroll) ---------- */

.reading-now { padding: 88px 0 100px; border-bottom: none; }
.reading-panel {
  display: grid;
  grid-template-columns: 220px 1fr;
  gap: 48px;
  align-items: center;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 40px;
}
.reading-cover { position: relative; padding-top: 14px; }
.reading-cover .book-cover { aspect-ratio: 2/3; }
.ribbon {
  position: absolute;
  top: -2px; left: 26px;
  width: 16px;
  max-height: calc(100% - 12px);
  background: var(--accent);
  clip-path: polygon(0 0, 100% 0, 100% 88%, 50% 100%, 0 88%);
  box-shadow: 0 4px 10px -4px rgba(0,0,0,0.4);
  z-index: 2;
  transition: height 700ms var(--ease);
}
.reading-info .eyebrow { margin-bottom: 14px; }
.reading-info h3 {
  font-family: var(--serif);
  font-size: 30px;
  font-weight: 500;
  margin: 0 0 8px;
}
.reading-info .author { color: var(--ink-soft); font-size: 14.5px; margin: 0 0 22px; }
.progress-row {
  display: flex; align-items: center; gap: 14px;
  font-size: 12.5px; color: var(--ink-faint);
  font-variant-numeric: tabular-nums;
  margin-bottom: 26px;
}
.progress-track {
  flex: 1; height: 2px; background: var(--line); position: relative; border-radius: 2px;
}
.progress-fill {
  position: absolute; left: 0; top: 0; bottom: 0;
  background: var(--accent);
  border-radius: 2px;
  transition: width 900ms var(--ease);
}
.btn {
  display: inline-flex; align-items: center; gap: 10px;
  padding: 13px 26px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: var(--radius);
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: transform 200ms var(--ease), background 200ms var(--ease);
}
.btn:hover { transform: translateY(-2px); background: var(--accent-soft); }
.btn svg { width: 15px; height: 15px; }

@media (max-width: 680px) {
  .reading-panel { grid-template-columns: 1fr; text-align: left; }
  .reading-cover { width: 150px; }
}

/* ---------- tela de leitura (modal do PDF) ---------- */

.reader-overlay {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: color-mix(in srgb, #000 55%, transparent);
  backdrop-filter: blur(4px);
  opacity: 0;
  transition: opacity 220ms var(--ease);
}
.reader-overlay.is-open { display: flex; opacity: 1; }

.reader-panel {
  width: 100%;
  max-width: 880px;
  height: min(88vh, 920px);
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 8px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transform: translateY(14px) scale(0.98);
  transition: transform 260ms var(--ease);
  box-shadow: 0 30px 60px -20px rgba(0,0,0,0.35);
}
.reader-overlay.is-open .reader-panel { transform: translateY(0) scale(1); }

.reader-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 20px;
  padding: 22px 26px;
  border-bottom: 1px solid var(--line);
  flex-shrink: 0;
}
.reader-eyebrow { font-size: 12.5px; color: var(--ink-soft); margin: 0 0 4px; }
.reader-head h2 {
  font-family: var(--serif); font-weight: 500; font-size: 21px; margin: 0;
}
.reader-close {
  width: 34px; height: 34px; flex-shrink: 0;
  border-radius: 50%; border: 1px solid var(--line); background: var(--surface);
  display: grid; place-items: center; cursor: pointer; color: var(--ink-soft);
  transition: background 200ms var(--ease), color 200ms var(--ease);
}
.reader-close:hover { background: var(--surface-2); color: var(--ink); }
.reader-close svg { width: 15px; height: 15px; }

.reader-body { flex: 1; min-height: 0; background: var(--surface-2); position: relative; overflow-y: auto; }
.reader-frame { width: 100%; height: 100%; border: none; }
.reader-empty {
  height: 100%; display: grid; place-items: center;
  color: var(--ink-faint); font-size: 14px; text-align: center; padding: 30px;
}
.reader-pdf {
  min-height: 100%;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 24px;
}
.reader-pdf canvas {
  max-width: 100%;
  box-shadow: 0 10px 30px -12px rgba(0,0,0,0.3);
  background: #fff;
}

.reader-foot {
  padding: 16px 26px;
  border-top: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  flex-shrink: 0;
}
.reader-nav {
  display: flex; align-items: center; gap: 14px;
  font-size: 13px; color: var(--ink-soft); font-variant-numeric: tabular-nums;
  flex-shrink: 0;
}
.reader-nav-btn {
  width: 30px; height: 30px; border-radius: 50%;
  border: 1px solid var(--line); background: var(--surface);
  display: grid; place-items: center; cursor: pointer; color: var(--ink);
  transition: background 180ms var(--ease);
}
.reader-nav-btn:hover { background: var(--surface-2); }
.reader-nav-btn:disabled { opacity: 0.35; cursor: default; }
.reader-nav-btn svg { width: 14px; height: 14px; }
.reader-synopsis {
  font-size: 13px; color: var(--ink-soft); margin: 0;
  line-height: 1.5; max-width: 40ch;
  flex: 1; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.reader-download {
  flex-shrink: 0;
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 13px; color: var(--accent); white-space: nowrap;
}
.reader-download svg { width: 13px; height: 13px; }
.reader-download:hover { color: var(--accent-soft); }

body.reader-open { overflow: hidden; }

@media (max-width: 640px) {
  .reader-overlay { padding: 0; }
  .reader-panel { max-width: none; height: 100vh; border-radius: 0; }
  .reader-foot { flex-direction: column; align-items: stretch; }
  .reader-synopsis { display: none; }
}

/* ---------- footer ---------- */

.site-footer {
  padding: 40px 0 60px;
  font-size: 12.5px;
  color: var(--ink-faint);
}
.site-footer a { color: var(--ink-faint); border-bottom: 1px solid transparent; }
.site-footer a:hover { color: var(--ink-soft); border-color: var(--ink-faint); }

@media (max-width: 720px) {
  nav.main-nav { display: none; }
  .wrap { padding: 0 20px; }
}

/* ==========================================================================
   admin.html — login e formulário de upload
   ========================================================================== */

.admin-shell { min-height: 100vh; display: flex; flex-direction: column; }
.admin-main { flex: 1; padding: 56px 0 90px; }

.login-box {
  max-width: 380px;
  margin: 80px auto 0;
  padding: 40px 36px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--surface);
}
.login-box h1 {
  font-family: var(--serif); font-weight: 500; font-size: 24px; margin: 0 0 6px;
}
.login-box p.hint { color: var(--ink-soft); font-size: 13.5px; margin: 0 0 28px; }

.field { margin-bottom: 18px; }
.field label {
  display: block; font-size: 12.5px; color: var(--ink-soft);
  margin-bottom: 7px; letter-spacing: 0.02em;
}
.field input,
.field textarea,
.field select {
  width: 100%;
  padding: 11px 13px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 14px;
  transition: border-color 200ms var(--ease);
}
.field input:focus, .field textarea:focus, .field select:focus {
  border-color: var(--accent); outline: none;
}
.field textarea { resize: vertical; min-height: 90px; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.checkbox-row { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; }
.checkbox-row input { width: 16px; height: 16px; }
.checkbox-row label { font-size: 13.5px; color: var(--ink-soft); }

.admin-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 44px;
}
.admin-header h1 { font-family: var(--serif); font-weight: 500; font-size: 26px; margin: 0; }
.btn-ghost {
  background: none; border: 1px solid var(--line); color: var(--ink-soft);
  padding: 10px 18px; border-radius: var(--radius); font-size: 13.5px; cursor: pointer;
  transition: border-color 200ms var(--ease), color 200ms var(--ease);
}
.btn-ghost:hover { border-color: var(--ink-faint); color: var(--ink); }

.upload-card {
  border: 1px solid var(--line); border-radius: 6px; padding: 32px;
  background: var(--surface); margin-bottom: 56px;
}
.upload-card h2 { font-family: var(--serif); font-size: 19px; font-weight: 600; margin: 0 0 24px; }

.form-msg { font-size: 13px; margin-top: 14px; }
.form-msg.ok { color: #3f7a4f; }
.form-msg.err { color: #b3453f; }

.admin-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.admin-table th {
  text-align: left; font-size: 11.5px; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--ink-faint); font-weight: 500; padding: 0 12px 10px; border-bottom: 1px solid var(--line);
}
.admin-table td { padding: 14px 12px; border-bottom: 1px solid var(--line); color: var(--ink-soft); vertical-align: middle; }
.admin-table td.title-cell { color: var(--ink); font-weight: 500; }
.tag {
  display: inline-block; font-size: 11px; padding: 3px 9px; border-radius: 20px;
  background: var(--surface-2); color: var(--ink-soft);
}
.tag.reading { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); }
.row-actions button {
  background: none; border: none; color: var(--ink-faint); cursor: pointer; font-size: 12.5px;
  text-decoration: underline; padding: 0;
}
.row-actions button:hover { color: #b3453f; }

</style>
</head>
<body class="admin-shell">

<header class="site-header">
  <div class="wrap">
    <a href="index.html" class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 7v14" />
        <path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z" />
      </svg>
      <span>Nártiva<small>ADMINISTRAÇÃO</small></span>
    </a>
    <div class="header-actions">
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Alternar tema claro/escuro">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
        </svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2" />
          <path d="M12 20v2" />
          <path d="m4.93 4.93 1.41 1.41" />
          <path d="m17.66 17.66 1.41 1.41" />
          <path d="M2 12h2" />
          <path d="M20 12h2" />
          <path d="m6.34 17.66-1.41 1.41" />
          <path d="m19.07 4.93-1.41 1.41" />
        </svg>
      </button>
    </div>
  </div>
</header>

<div id="login-box" class="login-box">
  <h1>Entrar</h1>
  <p class="hint">Acesso restrito ao administrador do acervo.</p>
  <form id="login-form">
    <div class="field">
      <label for="email">E-mail</label>
      <input id="email" type="email" required autocomplete="username" />
    </div>
    <div class="field">
      <label for="password">Senha</label>
      <input id="password" type="password" required autocomplete="current-password" />
    </div>
    <button class="btn" type="submit" style="width:100%; justify-content:center;">Entrar</button>
    <p id="login-msg" class="form-msg"></p>
  </form>
</div>

<main id="admin-main" class="admin-main" style="display:none;">
  <div class="wrap">
    <div class="admin-header">
      <h1>Gerenciar acervo</h1>
      <button id="logout-btn" class="btn-ghost" type="button">Sair</button>
    </div>

    <div class="upload-card">
      <h2>Adicionar livro</h2>
      <form id="upload-form">
        <div class="field-row">
          <div class="field">
            <label for="title">Título</label>
            <input id="title" required />
          </div>
          <div class="field">
            <label for="author">Autor</label>
            <input id="author" required />
          </div>
        </div>

        <div class="field">
          <label for="synopsis">Sinopse</label>
          <textarea id="synopsis"></textarea>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="rating">Avaliação (0 a 5)</label>
            <input id="rating" type="number" min="0" max="5" step="0.1" value="0" />
          </div>
          <div class="field">
            <label for="cover-file">Capa (imagem)</label>
            <input id="cover-file" type="file" accept="image/*" />
          </div>
        </div>

        <div class="field">
          <label for="book-file">Arquivo do livro (PDF/EPUB)</label>
          <input id="book-file" type="file" accept=".pdf,.epub" />
        </div>

        <div class="checkbox-row">
          <input id="is-reading" type="checkbox" />
          <label for="is-reading">Marcar como "Lendo agora" na página inicial</label>
        </div>
        <p class="hint" style="margin: -14px 0 22px;">O progresso de leitura (página atual) é salvo sozinho conforme o livro é lido no site, não precisa preencher aqui.</p>

        <button class="btn" type="submit">Publicar no acervo</button>
        <p id="upload-msg" class="form-msg"></p>
      </form>
    </div>

    <h2 style="font-family: var(--serif); font-weight: 500; font-size: 19px; margin-bottom: 18px;">Acervo atual</h2>
    <table class="admin-table">
      <thead>
        <tr><th>Título</th><th>Autor</th><th>Nota</th><th>Status</th><th></th></tr>
      </thead>
      <tbody id="admin-table-body"></tbody>
    </table>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ==========================================================================
// Preencha com os dados do seu projeto Supabase (Project Settings > API).
// A anon key é pública por natureza — pode ficar no front-end. Quem protege
// os dados são as políticas de RLS configuradas em schema.sql.
// ==========================================================================
const SUPABASE_URL = "https://nhbandlokbcnkustpaok.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_Fc_e5dgGE3h5gSqMnqIXPw_zs1d2m-q";

const supabaseClient =
  SUPABASE_URL.startsWith("http") && window.supabase
    ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
    : null;


window.supabaseClient = (typeof supabaseClient !== 'undefined') ? supabaseClient : null;

(function initTheme() {
  const saved = localStorage.getItem("nartiva-theme");
  const preferred = saved || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  document.documentElement.setAttribute("data-theme", preferred);
})();

const els = {};

document.addEventListener("DOMContentLoaded", () => {
  els.loginBox = document.getElementById("login-box");
  els.loginForm = document.getElementById("login-form");
  els.loginMsg = document.getElementById("login-msg");
  els.adminMain = document.getElementById("admin-main");
  els.logoutBtn = document.getElementById("logout-btn");
  els.uploadForm = document.getElementById("upload-form");
  els.uploadMsg = document.getElementById("upload-msg");
  els.tableBody = document.getElementById("admin-table-body");
  els.themeToggle = document.getElementById("theme-toggle");
  els.readingCheck = document.getElementById("is-reading");

  if (els.themeToggle) {
    els.themeToggle.addEventListener("click", () => {
      const current = document.documentElement.getAttribute("data-theme");
      const next = current === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      localStorage.setItem("nartiva-theme", next);
    });
  }

  if (!window.supabaseClient) {
    els.loginMsg.textContent = "Configure config.js com a URL e a chave do seu projeto Supabase para ativar o login.";
    els.loginMsg.className = "form-msg err";
    return;
  }

  checkSession();

  els.loginForm.addEventListener("submit", handleLogin);
  els.logoutBtn.addEventListener("click", handleLogout);
  els.uploadForm.addEventListener("submit", handleUpload);
});

async function checkSession() {
  const { data } = await window.supabaseClient.auth.getSession();
  toggleView(!!data.session);
  if (data.session) loadBooks();
}

function toggleView(loggedIn) {
  els.loginBox.style.display = loggedIn ? "none" : "block";
  els.adminMain.style.display = loggedIn ? "block" : "none";
}

async function handleLogin(e) {
  e.preventDefault();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  els.loginMsg.textContent = "Entrando…";
  els.loginMsg.className = "form-msg";
  const { error } = await window.supabaseClient.auth.signInWithPassword({ email, password });
  if (error) {
    els.loginMsg.textContent = "E-mail ou senha inválidos.";
    els.loginMsg.className = "form-msg err";
    return;
  }
  toggleView(true);
  loadBooks();
}

async function handleLogout() {
  await window.supabaseClient.auth.signOut();
  toggleView(false);
}

async function handleUpload(e) {
  e.preventDefault();
  els.uploadMsg.textContent = "Enviando…";
  els.uploadMsg.className = "form-msg";

  try {
    const title = document.getElementById("title").value.trim();
    const author = document.getElementById("author").value.trim();
    const synopsis = document.getElementById("synopsis").value.trim();
    const rating = parseFloat(document.getElementById("rating").value || "0");
    const isReading = els.readingCheck.checked;
    const coverFile = document.getElementById("cover-file").files[0];
    const bookFile = document.getElementById("book-file").files[0];

    let cover_url = null;
    let file_url = null;

    if (coverFile) cover_url = await uploadToStorage("covers", coverFile);
    if (bookFile) file_url = await uploadToStorage("books", bookFile);

    if (isReading) {
      // garante que só existe um "lendo" por vez
      await window.supabaseClient.from("books").update({ status: "acervo" }).eq("status", "lendo");
    }

    const { error } = await window.supabaseClient.from("books").insert({
      title,
      author,
      synopsis,
      rating,
      cover_url,
      file_url,
      status: isReading ? "lendo" : "acervo",
      current_page: 0,
      total_pages: 0,
    });

    if (error) throw error;

    els.uploadMsg.textContent = "Livro adicionado ao acervo.";
    els.uploadMsg.className = "form-msg ok";
    els.uploadForm.reset();
    loadBooks();
  } catch (err) {
    els.uploadMsg.textContent = "Erro ao enviar: " + err.message;
    els.uploadMsg.className = "form-msg err";
  }
}

async function uploadToStorage(bucket, file) {
  const path = `${Date.now()}-${file.name}`;
  const { error } = await window.supabaseClient.storage.from(bucket).upload(path, file);
  if (error) throw error;
  const { data } = window.supabaseClient.storage.from(bucket).getPublicUrl(path);
  return data.publicUrl;
}

async function loadBooks() {
  const { data, error } = await window.supabaseClient
    .from("books")
    .select("*")
    .order("created_at", { ascending: false });
  if (error) return;
  els.tableBody.innerHTML = data
    .map(
      (b) => `
      <tr>
        <td class="title-cell">${b.title}</td>
        <td>${b.author}</td>
        <td>${Number(b.rating || 0).toFixed(1)}</td>
        <td><span class="tag ${b.status === "lendo" ? "reading" : ""}">${b.status === "lendo" ? "lendo agora" : "acervo"}</span></td>
        <td class="row-actions"><button data-id="${b.id}">remover</button></td>
      </tr>`
    )
    .join("");

  els.tableBody.querySelectorAll("button[data-id]").forEach((btn) => {
    btn.addEventListener("click", () => removeBook(btn.dataset.id));
  });
}

async function removeBook(id) {
  if (!confirm("Remover este livro do acervo?")) return;
  await window.supabaseClient.from("books").delete().eq("id", id);
  loadBooks();
}

</script>
</body>
</html>
